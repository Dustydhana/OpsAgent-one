services:
  - type: web
    name: opsagent-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/ready
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPSAGENT_API_SECRET
        sync: false
      - key: OPSAGENT_CREDENTIAL_MASTER_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPSAGENT_FRONTEND_URL
        value: https://ops-agent-one.vercel.app
      - key: OPSAGENT_OAUTH_CALLBACK_BASE
        value: https://ops-agent-one.vercel.app
      - key: OPSAGENT_CORS_ORIGINS
        value: https://ops-agent-one.vercel.app
      - key: OPSAGENT_DEFAULT_ORGANIZATION_ID
        value: org-default
      - key: OPSAGENT_COOKIE_SECURE
        value: "true"
      - key: OPSAGENT_CONNECTORS_IN_API
        value: "true"
      - key: APP_SIGNUP_ENABLED
        value: "false"
      - key: AWS_DRY_RUN
        value: "true"
      - key: VMWARE_DRY_RUN
        value: "true"
      - key: SSM_OPERATIONS_DRY_RUN
        value: "true"
      - key: SCCM_MODE
        value: simulation
